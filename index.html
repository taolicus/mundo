<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="#" type="image/x-icon" />
    <title>M U N D O</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./ui/styles.css" />
    <script src="./ui/app.js" type="module" defer></script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="stats">
      <div>DAY <b id="statTick">0</b></div>
      <div>POPULATION <b id="statPopulation">0</b></div>
    </div>
    <div id="panel">
      <button class="close" id="panelClose">&times;</button>
      <h3 id="panelTitle"></h3>
      <div id="panelBody"></div>
    </div>
    <div id="controls">
      <button id="play">Play</button>
      <button id="pause">Pause</button>
      <button id="tick">Tick</button>
    </div>
  </body>
</html>
