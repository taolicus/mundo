<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="#" type="image/x-icon" />
    <title>M U N D O</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200&display=swap"
      rel="stylesheet"
    />
    <script src="./motor.js" type="module" defer></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: black; }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #controls {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 1;
      }
      #controls button {
        background: #222;
        color: #fff;
        border: 1px solid #555;
        padding: 6px 16px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
        cursor: pointer;
      }
      #stats {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2;
        display: flex;
        gap: 24px;
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
        letter-spacing: 1px;
      }
      #stats span { color: #888; }
      #stats b { color: #fff; font-weight: 200; }
      #panel {
        position: fixed;
        top: 40px;
        right: 16px;
        width: 280px;
        max-height: calc(100vh - 80px);
        overflow-y: auto;
        z-index: 3;
        background: rgba(10, 10, 10, 0.9);
        border: 1px solid #444;
        color: #fff;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
        padding: 12px;
        display: none;
      }
      #panel h3 {
        font-weight: 200;
        letter-spacing: 1px;
        margin-bottom: 10px;
        color: #aaa;
        font-size: 13px;
      }
      #panel .row {
        display: flex;
        justify-content: space-between;
        padding: 3px 0;
        border-bottom: 1px solid #222;
      }
      #panel .row span { color: #888; }
      #panel .row b { font-weight: 200; color: #fff; }
      #panel .bar {
        height: 4px;
        background: #222;
        margin: 2px 0 6px;
      }
      #panel .bar .fill {
        height: 100%;
        background: #4a4;
      }
      #panel .close {
        position: absolute;
        top: 8px;
        right: 10px;
        background: none;
        border: none;
        color: #888;
        font-size: 16px;
        cursor: pointer;
        font-family: 'IBM Plex Mono', monospace;
      }
      #panel .close:hover { color: #fff; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="stats">
      <div>DIA <b id="statTick">0</b></div>
      <div>POBLACION <b id="statPoblacion">0</b></div>
      <div>RECURSOS <b id="statRecursos">0</b></div>
      <div>DESCUBRIMIENTOS <b id="statDescubrimientos">0</b></div>
    </div>
    <div id="panel">
      <button class="close" id="panelClose">&times;</button>
      <h3 id="panelTitle"></h3>
      <div id="panelBody"></div>
    </div>
    <div id="controls">
      <button id="play">Play</button>
      <button id="pause">Pause</button>
      <button id="tick">Tick</button>
    </div>
  </body>
</html>
